[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-neat-fold"
version = "0.1.0"
description = "Topological angle folding, pre-flight Clifford verification, and error mitigation conflict detection for IBM Quantum Runtime V2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Quantum Open Source Contributor", email = "research@genesix.tech" }
]
keywords = [
    "quantum",
    "qiskit",
    "transpiler",
    "heron",
    "error-mitigation",
    "clifford",
    "unitary-fund"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "qiskit>=1.0.0",
    "numpy>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "qiskit-ibm-runtime>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/kleitonbernardino-lab/qiskit-neat-fold"
Repository = "https://github.com/kleitonbernardino-lab/qiskit-neat-fold"
Issues = "https://github.com/kleitonbernardino-lab/qiskit-neat-fold/issues"
